version: "3.8"

# ══════════════════════════════════════════════════
# SG智能建站 — 企业级 Docker Compose
# 使用：docker compose up -d
# ══════════════════════════════════════════════════

services:
  # ── PostgreSQL 数据库 ──────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sg_builder
      POSTGRES_USER: sgbuilder
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgbuilder -d sg_builder"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 缓存（AI结果缓存/会话）──────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SG 智能建站应用 ────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sgbuilder:${DB_PASSWORD:-changeme}@db:5432/sg_builder
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${PORT:-10000}:10000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data  # SQLite备用/上传文件等

  # ── Nginx 反向代理（生产推荐）─────────────────
  # 取消注释以启用
  # nginx:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app

volumes:
  pgdata:
  redisdata:
  appdata:
