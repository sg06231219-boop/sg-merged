name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Render Service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e
          API="https://api.render.com/v1"
          AUTH="Authorization: Bearer $RENDER_API_KEY"
          
          # Get owner ID
          OWNER_ID=$(curl -sS "$API/owners" -H "$AUTH" | python3 -c "
          import sys, json
          owners = json.load(sys.stdin)
          print(owners[0]['owner']['id'])
          ")
          echo "Owner: $OWNER_ID"
          
          # Check if service exists
          SVC_ID=$(curl -sS "$API/services?name=sg-merged&type=web_service&limit=1" -H "$AUTH" | python3 -c "
          import sys, json
          svcs = json.load(sys.stdin)
          if svcs: print(svcs[0]['service']['id'])
          " 2>/dev/null || echo "")
          
          if [ -n "$SVC_ID" ]; then
            echo "Service exists: $SVC_ID, triggering deploy..."
            curl -sS -X POST "$API/services/$SVC_ID/deploys" -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "clear"}'
            echo "Deploy triggered!"
          else
            echo "Creating new service..."
            curl -sS -X POST "$API/services" -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d "{
                \"type\": \"web_service\",
                \"name\": \"sg-merged\",
                \"ownerId\": \"$OWNER_ID\",
                \"repo\": \"https://github.com/sg06231219-boop/sg-merged\",
                \"branch\": \"master\",
                \"autoDeploy\": \"yes\",
                \"serviceDetails\": {
                  \"env\": \"python\",
                  \"runtime\": \"python\",
                  \"buildCommand\": \"pip install --upgrade pip && pip install -r requirements.txt\",
                  \"startCommand\": \"uvicorn apis.app:app --host 0.0.0.0 --port \$PORT\",
                  \"envVars\": [
                    {\"key\": \"PYTHON_VERSION\", \"value\": \"3.12.0\"},
                    {\"key\": \"SITE_DOMAIN\", \"value\": \"sg-merged.onrender.com\"}
                  ]
                }
              }" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Created: {d[\"service\"][\"id\"]}')"
            echo "Service created and deploying!"
          fi
