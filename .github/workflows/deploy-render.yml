name: Deploy to Render

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or Update Render Service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -e
          API="https://api.render.com/v1"
          AUTH="Authorization: Bearer $RENDER_API_KEY"
          
          echo "=== List owners ==="
          OWNERS_JSON=$(curl -sS "$API/owners" -H "$AUTH")
          echo "$OWNERS_JSON" | python3 -m json.tool 2>/dev/null | head -20
          
          OWNER_ID=$(echo "$OWNERS_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if isinstance(data, list) and len(data) > 0:
              item = data[0]
              if 'owner' in item:
                  print(item['owner']['id'])
              elif 'id' in item:
                  print(item['id'])
          elif isinstance(data, dict):
              if 'owner' in data:
                  print(data['owner']['id'])
              elif 'id' in data:
                  print(data['id'])
              else:
                  print(list(data.keys())[:3])
          " 2>&1)
          echo "Owner ID: $OWNER_ID"
          
          echo "=== Check existing services ==="
          SVCS_JSON=$(curl -sS "$API/services?name=sg-merged&type=web_service&limit=3" -H "$AUTH")
          echo "$SVCS_JSON" | python3 -m json.tool 2>/dev/null | head -10
          
          SVC_ID=$(echo "$SVCS_JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if isinstance(data, list) and len(data) > 0:
              item = data[0]
              if 'service' in item:
                  print(item['service']['id'])
              elif 'id' in item:
                  print(item['id'])
          " 2>/dev/null || echo "")
          
          if [ -n "$SVC_ID" ] && [ "$SVC_ID" != "null" ]; then
            echo "Service exists: $SVC_ID, triggering deploy..."
            DEPLOY_JSON=$(curl -sS -X POST "$API/services/$SVC_ID/deploys" -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"clear"}')
            echo "$DEPLOY_JSON" | python3 -m json.tool 2>/dev/null | head -10
            echo "Deploy triggered!"
          else
            echo "=== Creating new service ==="
            CREATE_JSON=$(curl -sS -X POST "$API/services" -H "$AUTH" \
              -H "Content-Type: application/json" \
              -d "{
                \"type\": \"web_service\",
                \"name\": \"sg-merged\",
                \"ownerId\": \"$OWNER_ID\",
                \"repo\": \"https://github.com/sg06231219-boop/sg-merged\",
                \"branch\": \"master\",
                \"autoDeploy\": \"yes\",
                \"serviceDetails\": {
                  \"env\": \"python\",
                  \"runtime\": \"python\",
                  \"buildCommand\": \"pip install --upgrade pip && pip install -r requirements.txt\",
                  \"startCommand\": \"uvicorn apis.app:app --host 0.0.0.0 --port \$PORT\",
                  \"envVars\": [
                    {\"key\": \"PYTHON_VERSION\", \"value\": \"3.12.0\"},
                    {\"key\": \"SITE_DOMAIN\", \"value\": \"sg-merged.onrender.com\"}
                  ]
                }
              }")
            echo "$CREATE_JSON" | python3 -m json.tool 2>/dev/null | head -30
            NEW_ID=$(echo "$CREATE_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('service',d).get('id','?'))")
            echo "Service created: $NEW_ID"
          fi
