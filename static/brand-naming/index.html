<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI品牌命名工坊 - SG智能建站</title>
<link rel="stylesheet" href="/static/tool-shared/style.css">
<style>:root{--accent1:#fdcb6e;--accent2:#e17055}</style>
</head>
<body>
<div class="container">
<a href="/" class="back">← 返回首页</a>
<div class="header"><h1>💡 AI品牌命名工坊</h1><p>AI起名+标语+品牌故事，一步到位</p></div>

<div class="quota"><span>今日免费额度</span><span class="rem" id="quotaText">加载中...</span></div>

<div class="glass">
<h2>📝 输入信息</h2>
<div class="field"><label class="fl">业务描述</label><textarea id="description" placeholder="如：面向年轻人的潮流咖啡品牌，主打精品手冲+社交空间..."></textarea></div>
<div class="row">
<div class="field"><label class="fl">行业（可选）</label><input id="industry" placeholder="如：餐饮、科技、教育"></div>
<div class="field"><label class="fl">输出语言</label><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="mixed">中英双语</option></select></div>
</div>
<div class="chips" id="styleChips"><span class="chip active" data-val="tech">⚡ 科技感</span><span class="chip" data-val="elegant">✨ 优雅风</span><span class="chip" data-val="fun">🎮 趣味型</span><span class="chip" data-val="professional">🏛️ 专业感</span><span class="chip" data-val="global">🌍 国际化</span></div>
<button class="btn btn-primary" id="genBtn" data-action="generate">💡 开始生成</button>
</div>

<div id="progressArea" class="glass hidden"><h2>⏳ 生成进度</h2><div id="steps" class="steps"></div></div>
<div id="resultArea" class="glass hidden"><h2>🎉 生成结果</h2><div id="resultContent"></div><div class="export-bar"><button class="btn-sm" data-action="copyAll">📋 复制文本</button><button class="btn-sm" data-action="exportJSON">💾 导出JSON</button></div></div>
<div id="errorArea" class="glass hidden"><div class="error" id="errorMsg"></div></div>

<div class="glass"><h2>📖 命名风格说明</h2><div class="steps"><div class="step"><div class="dot">⚡</div><div class="txt">科技感 — 简洁、未来感、创新</div></div><div class="step"><div class="dot">✨</div><div class="txt">优雅风 — 精致、高端、品味</div></div><div class="step"><div class="dot">🎮</div><div class="txt">趣味型 — 活泼、记忆点、传播力</div></div><div class="step"><div class="dot">🏛️</div><div class="txt">专业感 — 可信、权威、稳重</div></div><div class="step"><div class="dot">🌍</div><div class="txt">国际化 — 跨文化、易发音、.com可用</div></div></div></div>
</div>

<script src="/static/tool-shared/base.js"></script>
<script>
var tool = new SG.ToolBase({apiBase:'/api/v1/naming', stepTexts:['提交任务...','AI构思品牌名中...','整理命名方案...']});
tool.getButtonLabel = function(){ return '💡 开始生成'; };
tool.onResult = function(r) {
  tool._lastResult = r;
  SG.$('errorArea').classList.add('hidden');
  SG.$('progressArea').classList.add('hidden');
  SG.$('resultArea').classList.remove('hidden');
  if(!r) return;
  var h = '';
  if(r.summary) h += '<div class="result-card" style="border-color:var(--accent1);background:rgba(253,203,110,.06)"><h3>🎯 命名策略</h3><p>'+SG.escHtml(r.summary)+'</p></div>';
  if(r.names && r.names.length) {
    r.names.forEach(function(n,i) {
      var scoreClass = n.score >= 8 ? 'tag-success' : n.score >= 5 ? 'tag-info' : 'tag-warn';
      h += '<div class="result-card"><h3 style="display:flex;align-items:center;gap:8px">'+SG.escHtml(n.name);
      if(n.name_en) h += '<span style="color:var(--text2);font-size:.85rem">'+SG.escHtml(n.name_en)+'</span>';
      h += '<span class="tag '+scoreClass+'">★'+(n.score||'-')+'</span></h3>';
      if(n.slogan) h += '<p style="font-size:1.05rem;font-weight:600;color:var(--accent2);margin-bottom:6px">💬 '+SG.escHtml(n.slogan)+'</p>';
      if(n.rationale) h += '<p style="font-size:.85rem">💡 '+SG.escHtml(n.rationale)+'</p>';
      h += '<div style="display:flex;gap:12px;margin-top:6px;font-size:.8rem;color:var(--text2)">';
      if(n.domain_hint) h += '<span>🌐 '+SG.escHtml(n.domain_hint)+'</span>';
      if(n.vibe) h += '<span>✨ '+SG.escHtml(n.vibe)+'</span>';
      h += '</div></div>';
    });
  }
  if(r.taglines && r.taglines.length) {
    h += '<div class="result-card"><h3>💬 备选Slogan</h3><ul>';
    r.taglines.forEach(function(t){ h += '<li>'+SG.escHtml(t.tagline)+' <span style="color:var(--text2);font-size:.8rem">('+SG.escHtml(t.scenario||'')+')</span></li>'; });
    h += '</ul></div>';
  }
  if(r.brand_story) h += '<div class="result-card"><h3>📖 品牌故事模板</h3><p style="white-space:pre-wrap">'+SG.escHtml(r.brand_story)+'</p></div>';
  if(r.naming_tips && r.naming_tips.length) {
    h += '<div class="result-card"><h3>📌 命名建议</h3><ul>';
    r.naming_tips.forEach(function(t){ h += '<li>'+SG.escHtml(t)+'</li>'; });
    h += '</ul></div>';
  }
  SG.$('resultContent').innerHTML = h;
};

SG.initChips('styleChips');

document.addEventListener('click', function(e) {
  if(e.target.closest('[data-action="generate"]') && !tool.generating) {
    var desc = SG.$('description').value.trim();
    if(!desc) { SG.showToast('请输入业务描述','error'); return; }
    tool.submit('/generate', {description:desc, style:SG.getActiveChip('styleChips'), industry:SG.$('industry').value.trim(), lang:SG.$('lang').value}, '创作中...');
  }
  if(e.target.closest('[data-action="copyAll"]')) tool.copyResult();
  if(e.target.closest('[data-action="exportJSON"]')) tool.exportJSON();
});
tool.syncQuota();
</script>
</body>
</html>
