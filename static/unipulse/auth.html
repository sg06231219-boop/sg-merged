<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · UniPulse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #334155}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:28px;color:#fbbf24;font-weight:700}.logo p{color:#94a3b8;margin-top:4px;font-size:14px}
.tabs{display:flex;border-bottom:2px solid #334155;margin-bottom:24px}
.tab{flex:1;text-align:center;padding:12px 0;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:15px;font-weight:600;transition:.2s}
.tab.active{color:#fbbf24;border-bottom-color:#fbbf24}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:#cbd5e1;margin-bottom:6px;font-size:13px;font-weight:500}
.form-group input{width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:10px;color:#e2e8f0;font-size:15px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#fbbf24}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:transform .1s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(245,158,11,.4)}
.btn:active{transform:translateY(0)}
.error{background:#7f1d1d;color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.success{background:#14532d;color:#86efac;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.hidden{display:none!important}
.profile{text-align:center}
.profile .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;color:#0f172a;font-weight:700}
.profile h3{color:#e2e8f0;font-size:20px;margin-bottom:4px}
.profile p{color:#94a3b8;margin-bottom:24px}
.profile .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.profile .link{display:inline-block;padding:10px 20px;border-radius:8px;font-size:14px;text-decoration:none;font-weight:600;transition:.2s}
.link-primary{background:#fbbf24;color:#0f172a}.link-primary:hover{background:#f59e0b}
.link-secondary{background:#334155;color:#e2e8f0}.link-secondary:hover{background:#475569}
.dim{color:#64748b;font-size:12px;text-align:center;margin-top:20px}
</style>
<script>
document.addEventListener('click', function(e) {
    const action = e.target.closest('[data-action]');
    if (action) { const fn = action.dataset.action; if (typeof window[fn] === 'function') window[fn](e); }
});
</script>
</head>
<body>
<div class="card">
  <div class="logo"><h1>🎓 UniPulse</h1><p>高校风向标 · 用户中心</p></div>

  <!-- Auth forms -->
  <div id="auth-section">
    <div class="tabs">
      <div class="tab active" data-action="switchTab">登录</div>
      <div class="tab" data-action="switchTab">注册</div>
    </div>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group"><label>邮箱</label><input type="email" id="login-email" required placeholder="your@email.com"></div>
      <div class="form-group"><label>密码</label><input type="password" id="login-password" required placeholder="至少6位"></div>
      <button type="submit" class="btn">登 录</button>
    </form>

    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group"><label>用户名</label><input type="text" id="reg-username" required placeholder="3-30个字符" minlength="3" maxlength="30"></div>
      <div class="form-group"><label>邮箱</label><input type="email" id="reg-email" required placeholder="your@email.com"></div>
      <div class="form-group"><label>密码</label><input type="password" id="reg-password" required placeholder="至少6位" minlength="6"></div>
      <button type="submit" class="btn">注 册</button>
    </form>
  </div>

  <!-- Logged in profile -->
  <div id="profile-section" class="hidden profile">
    <div class="avatar" id="avatar-letter">U</div>
    <h3 id="profile-name"></h3>
    <p id="profile-email"></p>
    <div class="links">
      <a href="/" class="link link-primary">🏠 进入 UniPulse</a>
      <button data-action="logout" class="link link-secondary">🚪 退出登录</button>
    </div>
  </div>

  <p class="dim">登录后即可在论坛发帖互动</p>
</div>

<script>
const BASE = window.location.origin;
const API = BASE + '/api';

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('success').style.display = 'none';
}
function showSuccess(msg) {
  const el = document.getElementById('success');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('error').style.display = 'none';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('login-form').classList.add('hidden');
  document.getElementById('register-form').classList.add('hidden');
  if (tab === 'login') {
    document.querySelector('.tab:first-child').classList.add('active');
    document.getElementById('login-form').classList.remove('hidden');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
    document.getElementById('register-form').classList.remove('hidden');
  }
}

async function handleLogin(e) {
  e.preventDefault();
  try {
    const r = await fetch(API+'/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail||'登录失败');
    localStorage.setItem('unipulse_token', data.token);
    localStorage.setItem('unipulse_user', JSON.stringify(data.user));
    showProfile(data.user);
  } catch(err) { showError(err.message); }
}

async function handleRegister(e) {
  e.preventDefault();
  try {
    const r = await fetch(API+'/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail||'注册失败');
    localStorage.setItem('unipulse_token', data.token);
    localStorage.setItem('unipulse_user', JSON.stringify(data.user));
    showSuccess('注册成功！');
    setTimeout(() => showProfile(data.user), 800);
  } catch(err) { showError(err.message); }
}

function showProfile(user) {
  document.getElementById('auth-section').classList.add('hidden');
  document.getElementById('profile-section').classList.remove('hidden');
  document.getElementById('avatar-letter').textContent = user.username[0].toUpperCase();
  document.getElementById('profile-name').textContent = user.username;
  document.getElementById('profile-email').textContent = user.email;
}

function logout() {
  const token = localStorage.getItem('unipulse_token');
  if (token) fetch(API+'/auth/logout', {method:'POST', headers:{'Authorization':'Bearer '+token}}).catch(()=>{});
  localStorage.removeItem('unipulse_token');
  localStorage.removeItem('unipulse_user');
  document.getElementById('auth-section').classList.remove('hidden');
  document.getElementById('profile-section').classList.add('hidden');
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('register-form').classList.add('hidden');
  showSuccess('已退出登录');
}

// Check if already logged in
(function() {
  const token = localStorage.getItem('unipulse_token');
  if (!token) return;
  fetch(API+'/auth/me', {headers:{'Authorization':'Bearer '+token}})
    .then(r => r.json())
    .then(data => {
      if (data.id) {
        localStorage.setItem('unipulse_user', JSON.stringify(data));
        showProfile(data);
      } else {
        localStorage.removeItem('unipulse_token');
        localStorage.removeItem('unipulse_user');
      }
    })
    .catch(() => {
      localStorage.removeItem('unipulse_token');
      localStorage.removeItem('unipulse_user');
    });
})();
</script>
</body>
</html>
